<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 270" width="710" height="270"><style>
.fin{transform-box:fill-box;transform-origin:0% 50%;animation:kick .4s ease-in-out infinite alternate}
.fin.b{animation-direction:alternate-reverse}
@keyframes kick{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.swim{animation:swim 1.6s ease-in-out infinite alternate}
.swim.b{animation-delay:-.8s}
@keyframes swim{from{transform:translateY(-4px) rotate(-2deg)}to{transform:translateY(5px) rotate(2deg)}}
.bub{animation:bub 1.8s ease-in infinite;transform-box:fill-box;transform-origin:center}
@keyframes bub{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(18px,-70px) scale(1.2);opacity:0}}
.fish{animation:fishy .5s ease-in-out infinite alternate}
@keyframes fishy{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.tail2{transform-box:fill-box;transform-origin:0% 50%;animation:tailf .25s ease-in-out infinite alternate}
@keyframes tailf{from{transform:scaleY(.6)}to{transform:scaleY(1.1)}}
.weed{transform-box:fill-box;transform-origin:50% 100%;animation:weed 2.2s ease-in-out infinite alternate}
@keyframes weed{from{transform:skewX(-10deg)}to{transform:skewX(10deg)}}
.hair2{transform-box:fill-box;transform-origin:100% 100%;animation:hair2 1.2s ease-in-out infinite alternate}
@keyframes hair2{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
