<svg xmlns="http://www.w3.org/2000/svg" viewBox="430 140 280 242" width="280" height="242"><style>
.leg{transform-box:fill-box;transform-origin:50% 8%;animation:la .34s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.leg.b{animation-name:lb}
@keyframes la{from{transform:rotate(38deg)}to{transform:rotate(-34deg)}}
@keyframes lb{from{transform:rotate(-34deg)}to{transform:rotate(38deg)}}
.bob{animation:bob .34s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes bob{from{transform:translateY(1px) rotate(-2deg)}to{transform:translateY(-5px) rotate(2deg)}}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .22s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.ears{transform-box:fill-box;transform-origin:50% 100%;animation:flap .17s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ride{animation:ride .22s ease-in-out infinite alternate}
@keyframes ride{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.hair{transform-box:fill-box;transform-origin:100% 40%;animation:hair .18s ease-in-out infinite alternate}
@keyframes hair{from{transform:rotate(-7deg) scaleX(.94)}to{transform:rotate(5deg) scaleX(1.06)}}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 1s ease-out infinite}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:.9}100%{transform:translate(-46px,-14px) scale(1.8);opacity:0}}
.speed{stroke-dasharray:18 14;animation:speed .35s linear infinite}
@keyframes speed{to{stroke-dashoffset:32}}
.road{animation:road .4s linear infinite}
@keyframes road{to{stroke-dashoffset:60}}
.beep{transform-box:fill-box;transform-origin:center;animation:beep 1.6s ease-in-out infinite}
@keyframes beep{0%,55%,100%{transform:scale(0) rotate(-12deg);opacity:0}62%{transform:scale(1.25) rotate(-6deg);opacity:1}70%,88%{transform:scale(1) rotate(-6deg);opacity:1}}
.palm{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
